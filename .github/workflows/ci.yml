name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The READMEs are pages of the docs site: a bad relative asset path breaks the
      # site without failing any test (it did, in #74).
      - run: pnpm docs:build

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit in this PR must carry a Signed-off-by trailer
        run: |
          # One line per commit, not per paragraph: a body with blank lines must
          # not split the trailer away from the subject.
          missing=$(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} \
            | while read -r sha; do
                git log -1 --format=%B "$sha" | grep -q '^Signed-off-by:' || git log -1 --format='%H %s' "$sha"
              done)
          if [ -n "$missing" ]; then
            echo "Commits without DCO sign-off (use: git commit -s):"
            echo "$missing"
            exit 1
          fi

# Fly.io app definition for a self-hosted renkei (Tokyo region).
#   fly launch --copy-config --no-deploy   (first time; pick the app name)
#   fly secrets set ...                    (see docs/guides/deploy-fly)
#   fly deploy
# Guide: docs/guides/deploy-fly.ja.md / deploy-fly.en.md
app = "my-renkei"            # change: must be globally unique on Fly
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  # Public URL — must match the app name above. Becomes the OIDC issuer.
  ISSUER = "https://my-renkei.fly.dev"
  # Mounts the /dev test relying party so you can try the login before
  # wiring a real client. Remove for production and set RENKEI_CLIENTS.
  RENKEI_DEV = "true"
  LINE_LOGIN_REGION = "jp"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
